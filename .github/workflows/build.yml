name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/VgmDesk.csproj -c Release
      - name: Test decoder integration
        shell: pwsh
        run: |
          curl.exe -fLsS https://github.com/vgmstream/vgmstream/releases/download/r2168/vgmstream-win64.zip -o cli.zip
          Expand-Archive cli.zip -DestinationPath cli
          python tests/fixtures.py fixtures
          dotnet run --project tests/EngineSmoke.csproj -c Release -- cli/vgmstream-cli.exe fixtures
      - name: Publish portable
        run: >
          dotnet publish src/VgmDesk.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VgmDesk-win-x64
          path: out
